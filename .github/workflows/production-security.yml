name: Dependencias de producao
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: '17 9 * * 1'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: FrontEnd/package-lock.json
      - run: npm ci --prefix FrontEnd --ignore-scripts
      - run: npm --prefix FrontEnd audit --omit=dev --audit-level=moderate
